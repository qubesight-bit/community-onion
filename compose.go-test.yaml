services:
  community-go-test:
    build:
      context: ./app
    container_name: community-onion-go-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    networks:
      - go_test_internal

networks:
  go_test_internal:
    name: community_onion_go_test_internal
